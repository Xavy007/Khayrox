<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Premium gold dropshadow for the neon glow effect in tab icon -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#d4af37" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#d4af37" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Official logo symbol with gold glow -->
  <g filter="url(#neon-glow)">
    <!-- Gold Top-Left Arm -->
    <path 
      d="M 25,25 L 40,25 L 54,39 L 39,39 Z" 
      fill="#d4af37" 
    />
    <!-- White Dynamic Swoosh (Bottom-Right Arm) -->
    <path 
      d="M 45,49 C 56,51 68,60 78,72 C 68,72 54,65 43,56 Z" 
      fill="#ffffff" 
    />
    <!-- Gold Slash (Forward Slash) -->
    <path 
      d="M 25,75 L 40,75 L 75,25 L 60,25 Z" 
      fill="#d4af37" 
    />
  </g>
</svg>
